name: publish

# npm Trusted Publishing (OIDC): no token, npm trusts this workflow via the package's settings on npmjs.com
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: npm publish
