name: publish

# npm Trusted Publishing (OIDC): no token, npm trusts this workflow via the package's settings on npmjs.com
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)" || { echo "::error::tag $GITHUB_REF_NAME != package.json version; run npm version first"; exit 1; }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Publish stable or preview channel
        env:
          NPM_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: npm publish --tag "$NPM_TAG"
