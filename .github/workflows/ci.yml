name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Bun version comes from `packageManager` in package.json.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run styles:check && bun run typecheck
      # `biome ci` is read-only and emits GitHub annotations on the diff.
      - name: Biome
        run: bunx biome ci .
      - name: Unit tests
        run: bun run test
      # `bun run format` regenerates it; a stale file means the index points at moved code
      - name: llms.txt up to date
        run: bun scripts/llms.ts --check

  package:
    name: npm build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # builds dist/ and checks it exports what src does, with a self-contained styles.css
      - run: bun run check:pilot
      - name: Pack
        run: npm pack --dry-run

  stories:
    name: Build stories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Ladle build
        run: bun run build:stories
